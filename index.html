<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menu</title>
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    .swiper {
      width: 100vw;
      height: 100vh;
    }
    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
    }
    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    /* Simple progress dots on the side */
    .swiper-pagination-bullet {
      background: #ffffff;
      opacity: 0.4;
    }
    .swiper-pagination-bullet-active {
      background: #ffffff;
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="swiper">
  <div class="swiper-wrapper">
    <div class="swiper-slide"><img src="Page_1.png" alt="Page 1"></div>
    <div class="swiper-slide"><img src="Page_2.png" alt="Page 2"></div>
    <div class="swiper-slide"><img src="Page_3.png" alt="Page 3"></div>
    <div class="swiper-slide"><img src="Page_4.png" alt="Page 4"></div>
    <div class="swiper-slide"><img src="Page_5.png" alt="Page 5"></div>
    <div class="swiper-slide"><img src="Page_6.png" alt="Page 6"></div>
    <div class="swiper-slide"><img src="Page_7.png" alt="Page 7"></div>
    <div class="swiper-slide"><img src="Page_8.png" alt="Page 8"></div>
    <div class="swiper-slide"><img src="Page_9.png" alt="Page 9"></div>
    <div class="swiper-slide"><img src="Page_10.png" alt="Page 10"></div>
    <div class="swiper-slide"><img src="Page_11.png" alt="Page 11"></div>
    <div class="swiper-slide"><img src="Page_12.png" alt="Page 12"></div>
    <div class="swiper-slide"><img src="Page_13.png" alt="Page 13"></div>
    <div class="swiper-slide"><img src="Page_14.png" alt="Page 14"></div>
    <div class="swiper-slide"><img src="Page_15.png" alt="Page 15"></div>
  </div>
  <div class="swiper-pagination"></div>
</div>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const swiper = new Swiper('.swiper', {
    direction: 'vertical', /* TikTok style vertical swipe */
    mousewheel: true,      /* Enables trackpad/mouse scrolling */
    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },
  });

  // Tap left/top to go back, tap right/bottom to go forward
  document.addEventListener('click', (e) => {
    const screenWidth = window.innerWidth;
    if (e.clientX > screenWidth / 2) {
      swiper.slideNext();
    } else {
      swiper.slidePrev();
    }
  });
</script>
</body>
</html>
