<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wishlist</title>
  <!-- PageFlip JS & CSS -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #container {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .page {
      background-color: #ffffff;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div id="container">
  <div id="book">
    <div class="page" style="background-image: url('Page_1.png');"></div>
    <div class="page" style="background-image: url('Page_2.png');"></div>
    <div class="page" style="background-image: url('Page_3.png');"></div>
    <div class="page" style="background-image: url('Page_4.png');"></div>
    <div class="page" style="background-image: url('Page_5.png');"></div>
    <div class="page" style="background-image: url('Page_6.png');"></div>
    <div class="page" style="background-image: url('Page_7.png');"></div>
    <div class="page" style="background-image: url('Page_8.png');"></div>
    <div class="page" style="background-image: url('Page_9.png');"></div>
    <div class="page" style="background-image: url('Page_10.png');"></div>
    <div class="page" style="background-image: url('Page_11.png');"></div>
    <div class="page" style="background-image: url('Page_12.png');"></div>
    <div class="page" style="background-image: url('Page_13.png');"></div>
    <div class="page" style="background-image: url('Page_14.png');"></div>
    <div class="page" style="background-image: url('Page_15.png');"></div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const pageFlip = new St.PageFlip(
      document.getElementById('book'),
      {
        width: 600,
        height: 338,
        size: 'stretch',
        minWidth: 300,
        maxWidth: 1000,
        minHeight: 200,
        maxHeight: 700,
        maxShadowOpacity: 0.5,
        showCover: true,
        mobileScrollSupport: true
      }
    );
    pageFlip.loadFromHTML(document.querySelectorAll('.page'));
  });
</script>
</body>
</html>
